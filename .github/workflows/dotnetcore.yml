name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and analyze
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SonarQube can compute blame and new-code periods.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (required by the SonarQube scanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Restore .NET tools
        run: dotnet tool restore

      # Skipped when SONAR_TOKEN is unavailable (e.g. pull requests from forks).
      - name: SonarQube begin
        if: env.SONAR_TOKEN != ''
        shell: powershell
        run: >
          .\.sonar\scanner\dotnet-sonarscanner begin
          /k:"slipalison_Responses"
          /o:"slipalison"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="test/Responses.Tests/coverage/coverage.opencover.xml"

      - name: Build
        run: dotnet build Responses.sln -c Release

      # CoverletOutputFormat lists two formats separated by a comma. The comma is
      # escaped as %2C (MSBuild property escaping) so it survives shell/argument
      # parsing on any runner; a literal quoted "opencover,lcov" breaks under
      # PowerShell (MSB1006: Property is not valid. Switch: lcov).
      - name: Test with coverage (80% line floor)
        shell: powershell
        run: >
          dotnet test test/Responses.Tests/Responses.Tests.csproj -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover%2Clcov
          /p:CoverletOutput=./coverage/
          /p:ExcludeByAttribute=GeneratedCodeAttribute
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: SonarQube end
        if: env.SONAR_TOKEN != ''
        shell: powershell
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/Responses.Tests/coverage/coverage.info

  publish:
    name: Publish NuGet packages
    needs: build
    # Publishing is deliberate: it runs only when a GitHub Release is published,
    # packing the version currently in the csproj files.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Responses.sln -c Release -o ./artifacts

      # --skip-duplicate makes re-publishing an existing version a no-op,
      # replacing the old "publish on version change" behavior.
      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_TOKEN }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
